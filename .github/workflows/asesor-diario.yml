name: Asesor - actualización diaria

on:
  schedule:
    # Lunes a viernes 18:47 hora argentina (21:47 UTC), después del cierre
    - cron: "47 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asesor-main
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos de mercado
        run: python asesor/actualizar.py
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add asesor/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Asesor: datos del $(TZ=America/Argentina/Buenos_Aires date +%d/%m/%Y)"
            git pull --rebase origin main && git push
          fi
